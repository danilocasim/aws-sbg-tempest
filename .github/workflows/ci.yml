name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: tempest, POSTGRES_PASSWORD: tempest, POSTGRES_DB: tempest }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tempest" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://tempest:tempest@localhost:5432/tempest
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Migrate + seed + drift check
        run: pnpm db:migrate && pnpm db:seed && pnpm db:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (size gate 300 MB)
        run: |
          docker build -f docker/Dockerfile.web -t tempest-web . && docker build -f docker/Dockerfile.admin -t tempest-admin .
          for i in tempest-web tempest-admin; do s=$(docker image inspect $i --format '{{.Size}}'); echo "$i $((s/1024/1024)) MB"; [ "$s" -lt 314572800 ] || { echo "$i exceeds 300 MB"; exit 1; }; done
